name: Publicar Lumo no Firebase Hosting — release controlada

on:
  push:
    branches: ['release/uselumo-photos-20261123']
    paths: ['firebase.json', 'web/**', 'tests/live_public_smoke.py', 'tests/experience_navigation_static.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live-uselumo
  cancel-in-progress: false

jobs:
  firebase-live:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMO_515518 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar app e contratos antes de publicar
        run: |
          set -euo pipefail
          npm run check
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          if(f.hosting.public!=='web'||f.hosting.site!=='uselumo')throw Error('Site de destino incorreto');
          if(!fs.readFileSync('web/index.html','utf8').includes('listProductArtwork'))throw Error('Fotos de produtos ausentes');
          if(!fs.readFileSync('web/experience-sync.mjs','utf8').includes('waitForLocalSave'))throw Error('Proteção contra perda de dados ausente');
          console.log('Target confirmado: Firebase lumo-515518 / uselumo. Fotos e sincronização incluídas.');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium for predeploy browser regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate mobile UX, real product imagery contract and shared EAN photos
        run: python tests/experience_navigation_static.py
      - name: Registrar SHA da versão a publicar
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const release={app:'lumo',project:'lumo-515518',site:'uselumo',
            commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,
            publishedAt:new Date().toISOString()};
          fs.writeFileSync('web/release.json',JSON.stringify(release,null,2)+'\n');
          NODE
      - name: Exigir credencial de serviço privada e explícita
        run: |
          if [ -z "$FIREBASE_CREDENTIAL" ]; then
            echo '::error::Publicação interrompida: configure o segredo FIREBASE_SERVICE_ACCOUNT_LUMO_515518 ou FIREBASE_SERVICE_ACCOUNT no GitHub Actions do repositório. Nunca envie a chave pelo chat.'
            exit 1
          fi
      - name: Publicar no Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUMO_515518 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: lumo-515518
          channelId: live
      - name: Verificar resposta pública
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 \
            https://uselumo.web.app/ -o "$RUNNER_TEMP/lumo-published.html"
          grep -q 'lumo-identity-gate' "$RUNNER_TEMP/lumo-published.html"
          grep -q 'listProductArtwork' "$RUNNER_TEMP/lumo-published.html"
          # Hosting/CDN rollout can briefly serve the preceding release after
          # successful upload. Never accept a stale SHA, but retry with cache busting.
          matched=0
          for attempt in $(seq 1 12); do
            curl --fail --location --silent --show-error --retry 2 --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "https://uselumo.web.app/release.json?sha=${GITHUB_SHA}&attempt=${attempt}" \
              -o "$RUNNER_TEMP/lumo-release.json" || true
            if node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/lumo-release.json','utf8'));
          if(r.commit!==process.env.GITHUB_SHA||r.site!=='uselumo'||r.project!=='lumo-515518')process.exit(1);
          console.log('Firebase live confirmado no SHA '+r.commit);
          NODE
            then
              matched=1
              break
            fi
            echo "Aguardando consistência do Firebase Hosting, tentativa ${attempt}/12"
            sleep 5
          done
          if [ "$matched" != "1" ]; then
            echo '::error::Firebase Hosting não confirmou o SHA após a janela de verificação; publicação requer revisão.'
            exit 1
          fi
      - name: Validate published Google gate on mobile and tablet Chromium
        run: python tests/live_public_smoke.py
